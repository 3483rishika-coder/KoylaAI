services:
  - type: web
    name: koyla-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - { key: EVIDENCEOS_DATA_DIR, value: /data }
      - { key: EVIDENCEOS_EMBEDDINGS, value: "0" }
      - { key: LLM_PROVIDER, value: none }
      - { key: LLM_BASE_URL, value: "" }